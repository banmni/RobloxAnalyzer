<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robloyze</title>
</head>
<body>
<nav>
    <div class="navbar-logo"><a href="/">Logo</div>

    <input type="search" name="q" class="search-input" placeholder="Search a game...">

    <ul>
        <li><a href="/">Trending</a></li>
        <li><a href="/"></a>New Games</li>
        <li><a href="/"></a>Watchlist</li>
    </ul>
</nav>

<section class="filter-section">
    <h2>Filter Results</h2>
    <form class="filter-form">

        <fieldset class="filter-group">
            <legend class="legend-heading">Upload Date</legend>

            <div class="filter-options">
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="24H">
                    <span class="span-tag">24 Hours</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="7 Days">
                    <span class="span-tag">7 Days</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="1 Month">
                    <span class="span-tag">1 Month </span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="3 Months">
                    <span class="span-tag">3 Months</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="1 Year">
                    <span class="span-tag">1 Year</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Upload-Date" value="All Time">
                    <span class="span-tag">All Time</span>
                </label>
            </div>
        </fieldset>

        <fieldset class="filter-group">
            <legend class="legend-heading">Prioritize</legend>

            <div class="filter-options">
                <label class="option-label">
                    <input type="checkbox" name = "Prioritize" value="Recent-Games">
                    <span class="span-tag">Recent Games</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Prioritize" value="Most Popular">
                    <span class="span-tag">Most Popular</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "Prioritize" value="Best Growing">
                    <span class="span-tag">Best Growing</span>
                </label>
            </div>
        </fieldset>

        <!-- Make this be able to select multiple -->
        <fieldset class="filter-group">
            <legend class="legend-heading">Sort By</legend>

            <div class="filter-options">
                <label class="option-label">
                    <input type="checkbox" name = "sortBy" value="Highest-CCU">
                    <span class="span-tag">Highest ccu</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "sortBy" value="Lowest-CCU">
                    <span class="span-tag">Most Popular</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "sortBy" value="Newest">
                    <span class="span-tag">Newest</span>
                </label>
                <label class="option-label">
                    <input type="checkbox" name = "sortBy" value="Fastest-Grown">
                    <span class="span-tag">Fast growing</span>
                </label>
            </div>
        </fieldset>

        <fieldset class="filter-group">
            <legend class="legend-heading">Concurent Users (CCU)</legend>
            
            <div class="filter-ccu">
                <label class="ccu-label">
                    <span class="range-span">Min CCU</span>
                    <input type ="number" name="min-ccu" placeholder="Min ccu"
                    min ="0" step="100">
                </label>
            </div>

            <span class="ccu-divider">-</span>

            <div class="filter-ccu">
                <label class="ccu-label">
                    <span class="range-span">Max CCU</span>
                    <input type ="number" name="max-ccu" placeholder="Max ccu"
                    min ="0" step="100">
                </label>
            </div>

        </fieldset>
    </form>
</section>

<main>
    <div class="game-container">
        <h4 class="finder-title">Top Trending  &gt;</h4>

        <div class="card-main-container">
            <div class="card-container">
                <img class="card-img">

                <h3 class="card-game-title"></h3>

                <div class="card-bottom">
                    <div>
                        <span class="stat-label">Person Icon</span>
                        <strong class="stat-value">400</strong>
                    </div>
                    <div>
                         <span class="stat-label">Thumbs Up Icon</span>
                        <strong class="stat-value">90%</strong>
                    </div>
                    <div>
                        <span class="growth-arrow">^</span>
                        <span class="growth-value">14%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</main>
</body>
</html>
